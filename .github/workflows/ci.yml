name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Overseer.sln
      - name: Build
        run: dotnet build Overseer.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Overseer.sln --configuration Release --no-build --verbosity normal

  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build and test the installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version 0.0.1
