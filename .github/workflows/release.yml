name: Release

# Push a tag like v0.2.0 to build self-contained apps for every platform and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   archive: zip }
          - { os: windows-latest, rid: win-arm64, archive: zip }
          - { os: macos-latest,   rid: osx-arm64, archive: tar.gz }
          - { os: macos-latest,   rid: osx-x64,   archive: tar.gz }
          - { os: ubuntu-latest,  rid: linux-x64, archive: tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        if: matrix.rid == 'win-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'linux-x64'
        run: dotnet test Overseer.sln --configuration Release

      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$GITHUB_REF_NAME" || -z "$VERSION" ]] && VERSION="0.0.0-dev"
          dotnet publish src/Overseer.App/Overseer.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none \
            -p:Version="$VERSION" -o "out/overseer-${{ matrix.rid }}"
          cp README.md LICENSE "out/overseer-${{ matrix.rid }}/"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "out/overseer-${{ matrix.rid }}/*" -DestinationPath "overseer-${{ matrix.rid }}.zip"
          (Get-FileHash "overseer-${{ matrix.rid }}.zip" -Algorithm SHA256).Hash.ToLower() + "  overseer-${{ matrix.rid }}.zip" | Out-File -Encoding ascii "overseer-${{ matrix.rid }}.zip.sha256"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          chmod +x "out/overseer-${{ matrix.rid }}/Overseer"
          tar -czf "overseer-${{ matrix.rid }}.tar.gz" -C out "overseer-${{ matrix.rid }}"
          shasum -a 256 "overseer-${{ matrix.rid }}.tar.gz" > "overseer-${{ matrix.rid }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: overseer-${{ matrix.rid }}
          path: overseer-${{ matrix.rid }}.*

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Overseer $GITHUB_REF_NAME" --generate-notes --draft
